name: Update API index

on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 07:00 UTC (after package update)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - uses: dtolnay/rust-toolchain@stable

      - name: Clone typst
        run: |
          git clone --depth 1 https://github.com/typst/typst /tmp/typst-repo

      - name: Export upstream main API entries
        run: |
          mkdir -p /tmp/typst-repo/docs/src/bin
          cp tools/typst-api-exporter.rs /tmp/typst-repo/docs/src/bin/export-api.rs
          cd /tmp/typst-repo
          cargo run -p typst-docs --bin export-api --release -- \
            --out /tmp/typst-api-main-entries.json

      - name: Build main API index and BM25
        run: |
          python3 tools/fetch-api-docs.py /tmp/typst-api-main-entries.json \
            --input-format entries \
            --output-stem api-main \
            --out-dir skills/typst/data

      - name: Normalize formatting
        run: |
          pip install prek
          prek run --files skills/typst/data/api-main.json skills/typst/data/api-main-bm25.json || true

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- skills/typst/data/api-main.json skills/typst/data/api-main-bm25.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/typst/data/api-main.json skills/typst/data/api-main-bm25.json
          git commit -m "data: update main API index"
          git push
