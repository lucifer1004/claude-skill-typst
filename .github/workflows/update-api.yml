name: Update API index

on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 07:00 UTC (after package update)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - uses: dtolnay/rust-toolchain@stable

      - name: Clone typst and build typst-docs
        run: |
          git clone --depth 1 https://github.com/typst/typst /tmp/typst-repo
          cd /tmp/typst-repo
          cargo build -p typst-docs --release

      - name: Generate raw JSON
        run: |
          mkdir -p /tmp/typst-docs-assets
          /tmp/typst-repo/target/release/typst-docs \
            --assets-dir /tmp/typst-docs-assets \
            --out-file /tmp/typst-api-raw.json

      - name: Build API index and BM25
        run: python3 tools/fetch-api-docs.py /tmp/typst-api-raw.json --out-dir skills/typst/data

      - name: Normalize formatting
        run: |
          pip install prek
          prek run --files skills/typst/data/api.json skills/typst/data/api-bm25.json || true

      - name: Commit if changed
        run: |
          git diff --exit-code skills/typst/data/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/typst/data/api.json skills/typst/data/api-bm25.json
          git commit -m "data: update API index"
          git push
